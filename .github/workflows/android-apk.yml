
name: Build Industrial Strike APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'industrial-strike-project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Godot project
        run: |
          mkdir -p game
          unzip -q industrial-strike-project.zip -d game
          test -f game/project.godot

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          sudo install -m 0755 godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ -d "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates" ]; then
            mv "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
            rmdir "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates"
          fi
          godot --version

      - name: Configure Android signing
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --editor --path game --quit

      - name: Export Android APK
        run: |
          mkdir -p game/build
          godot --headless --path game --export-debug "Android" build/IndustrialStrike.apk
          test -s game/build/IndustrialStrike.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Industrial-Strike-Android-APK
          path: game/build/IndustrialStrike.apk
          if-no-files-found: error
          retention-days: 14
